# Deploys ArduStudio to GitHub Pages. MANUAL ONLY — see below.
#
# Pages deployments for this repository proved unreliable: they consistently
# took ~9-10 minutes, right at deploy-pages' hard ceiling. That ceiling cannot
# be raised — the action clamps its `timeout` input to 600000ms (10 minutes)
# and, on expiry, cancels the in-flight deployment. Runs also hit intermittent
# "Invalid actions OIDC token" errors. Neither is fixable from the repo side.
#
# The site is published by other means now, so this workflow no longer runs on
# push; leaving it on push would just produce a failed run on every commit.
# Start it by hand from the Actions tab ("Run workflow") if you ever want to
# try a Pages deploy again.
#
# configure-pages has enablement:true, so it switches the repository's Pages
# source to "GitHub Actions" by itself — no change needed in Settings -> Pages.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

# Permissions the deploy needs: read the repo, publish Pages, and mint the
# OIDC token deploy-pages uses to authenticate.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once, and let an in-flight deployment
# finish rather than cancelling it part way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on / switch it to Actions-based deployment if needed.
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ArduStudio is a static site served straight from the repo root.
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # NOTE: `timeout` cannot be raised above 600000ms — larger values are
          # silently clamped to that maximum, so there is no point setting one.
          # Tolerate more transient status-check errors before bailing out.
          error_count: 20
